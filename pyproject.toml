[project]
name = "pricepred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=2.3.0",
    "ipykernel>=7.4.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "sweetviz>=2.3.3",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
pricepred = "pricepred:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
